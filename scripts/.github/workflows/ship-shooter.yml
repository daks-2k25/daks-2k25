name: Atualizar ship-shooter

on:
  schedule:
    - cron: "0 3 * * *"      # todo dia às 03:00 UTC
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    paths:
      - "scripts/generate_ship.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar SVG com as contribuições reais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: daks-2k25
        run: python scripts/generate_ship.py
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ship-shooter.svg
          git diff --staged --quiet || git commit -m "chore: atualiza ship-shooter"
          git push
